import org.gradle.api.publish.PublishingExtension
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.plugins.signing.SigningExtension

def requiredRootProp = { List<String> keys ->
    def value = keys.collect { key ->
        rootProject.findProperty(key)?.toString()?.trim()
    }.find { it }

    if (!value) {
        throw new GradleException("Missing required property. Expected one of: ${keys.join(', ')}")
    }
    value
}

def optionalRootProp = { List<String> keys, String defaultValue = "" ->
    keys.collect { key ->
        rootProject.findProperty(key)?.toString()?.trim()
    }.find { it } ?: defaultValue
}

def envOrRootProp = { String envName, List<String> propKeys = [], String defaultValue = "" ->
    def envValue = System.getenv(envName)?.trim()
    envValue ?: optionalRootProp(propKeys, defaultValue)
}

def normalizeSigningKey = { Object raw, String charset = "UTF-8" ->
    def text = raw?.toString()?.trim()
    if (!text) return ""

    text = text.replace("\\r\\n", "\n").replace("\\n", "\n")
    if (text.startsWith("-----BEGIN PGP PRIVATE KEY BLOCK-----")) {
        return text
    }

    try {
        return new String(text.decodeBase64(), charset).trim()
    } catch (Exception ignored) {
        return text
    }
}

def isExternalPublishTaskRequested = { Project target ->
    target.gradle.startParameter.taskNames.any { taskName ->
        String normalized = taskName.toLowerCase()
        normalized.contains("publish") && !normalized.contains("mavenlocal")
    }
}

def configurePublishedJavaModule = { Project target, Map moduleMeta ->
    String signingKey = normalizeSigningKey(
            envOrRootProp(
                    "MAVEN_CENTRAL_GPG_PRIVATE_KEY",
                    ["mavenCentralSigningKey", "signingKey"]
            ),
            rootProject.ext.buildConfig.encoding
    )
    String signingPassword = envOrRootProp(
            "MAVEN_CENTRAL_GPG_PASSPHRASE",
            ["mavenCentralSigningPassword", "signingPassword"]
    )

    target.pluginManager.apply("maven-publish")
    target.pluginManager.apply("signing")

    target.extensions.configure(org.gradle.api.plugins.JavaPluginExtension) { java ->
        java.withSourcesJar()
        java.withJavadocJar()
    }

    target.extensions.configure(PublishingExtension) { publishing ->
        publishing.publications.register("mavenJava", MavenPublication) { publication ->
            publication.from(target.components.getByName("java"))
            publication.groupId = target.group.toString()
            publication.artifactId = moduleMeta.artifactId
            publication.version = target.version.toString()

            publication.pom {
                name.set(moduleMeta.pomName)
                description.set(moduleMeta.description)
                url.set(rootProject.ext.githubBaseUrl)

                licenses {
                    license {
                        name.set(optionalRootProp(["pom_license_name"], "The Apache License, Version 2.0"))
                        url.set(optionalRootProp(["pom_license_url"], "https://www.apache.org/licenses/LICENSE-2.0.txt"))
                    }
                }

                developers {
                    developer {
                        id.set(optionalRootProp(["pom_developer_id"], "jho951"))
                        name.set(optionalRootProp(["pom_developer_name"], "YJH (jho951)"))

                        String developerEmail = optionalRootProp(["pom_developer_email"], "jho951@naver.com")
                        if (developerEmail) {
                            email.set(developerEmail)
                        }

                        url.set(optionalRootProp(["pom_developer_url"], "https://github.com/${rootProject.ext.buildConfig.githubOrg}"))
                    }
                }

                scm {
                    connection.set("scm:git:${rootProject.ext.githubBaseUrl}.git")
                    developerConnection.set("scm:git:ssh://git@github.com/${rootProject.ext.buildConfig.githubOrg}/${rootProject.ext.buildConfig.githubRepo}.git")
                    url.set(rootProject.ext.githubBaseUrl)
                }
            }
        }
    }

    target.extensions.configure(SigningExtension) { signing ->
        signing.required {
            isExternalPublishTaskRequested(target)
        }

        if (signingKey) {
            signing.useInMemoryPgpKeys(signingKey, signingPassword)
        }

        signing.sign(target.extensions.getByType(PublishingExtension).publications)
    }

    target.tasks.withType(PublishToMavenRepository).configureEach { publishTask ->
        publishTask.doFirst {
            String username = envOrRootProp("MAVEN_CENTRAL_USERNAME", ["mavenCentralUsername", "ossrhUsername"])
            String password = envOrRootProp("MAVEN_CENTRAL_PASSWORD", ["mavenCentralPassword", "ossrhPassword"])

            if (!username || !password) {
                throw new GradleException(
                    "Missing Maven Central credentials. " +
                    "Set MAVEN_CENTRAL_USERNAME/MAVEN_CENTRAL_PASSWORD " +
                    "(or mavenCentralUsername/mavenCentralPassword)."
                )
            }

            if (!signingKey) {
                throw new GradleException(
                    "Missing signing key. " +
                    "Set MAVEN_CENTRAL_GPG_PRIVATE_KEY " +
                    "(or mavenCentralSigningKey/signingKey)."
                )
            }
        }
    }
}

def modules = [
        "rate-limiter-core": [
                artifactId : "rate-limiter-core",
                pomName    : "Rate Limiter Core",
                description: "Pure 1-layer rate limiter value objects."
        ],
        "rate-limiter-spi" : [
                artifactId : "rate-limiter-spi",
                pomName    : "Rate Limiter SPI",
                description: "Pure 1-layer rate limiter SPI contracts."
        ],
]

group = requiredRootProp(["release_group"])
version = requiredRootProp(["release_version"])

ext {
    buildConfig = [
            javaVersion : requiredRootProp(["java_version"]).toInteger(),
            junitVersion : optionalRootProp(["junit_version"], "5.10.0"),
            junitPlatformVersion: optionalRootProp(["junit_platform_version"], "1.10.0"),
            encoding    : optionalRootProp(["encoding", "encoding_method"], "UTF-8"),
            githubOrg   : requiredRootProp(["github_org"]),
            githubRepo  : requiredRootProp(["github_repo"]),
    ]
    junitVersion = buildConfig.junitVersion
    junitPlatformVersion = buildConfig.junitPlatformVersion
    encoding = buildConfig.encoding
    githubBaseUrl = "https://github.com/${buildConfig.githubOrg}/${buildConfig.githubRepo}"
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java-library"

    ext {
        junitVer = rootProject.ext.buildConfig.junitVersion
        junitPlatformVer = rootProject.ext.buildConfig.junitPlatformVersion
        encodingMethod = rootProject.ext.buildConfig.encoding
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.ext.buildConfig.javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release.set(rootProject.ext.buildConfig.javaVersion)
        options.encoding = rootProject.ext.buildConfig.encoding
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption("Xdoclint:none", "-quiet")
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.ext.buildConfig.junitVersion}")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "org.assertj:assertj-core:3.27.7"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

configure(subprojects.findAll { modules.containsKey(it.name) }) {
    configurePublishedJavaModule(project, modules[project.name])
}
