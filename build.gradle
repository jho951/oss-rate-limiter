def requiredRootProp = { List<String> keys ->
    def value = keys.collect { key ->
        rootProject.findProperty(key)?.toString()?.trim()
    }.find { it }

    if (!value) {
        throw new GradleException("Missing required property. Expected one of: ${keys.join(', ')}")
    }
    value
}

def optionalRootProp = { List<String> keys, String defaultValue = "" ->
    keys.collect { key ->
        rootProject.findProperty(key)?.toString()?.trim()
    }.find { it } ?: defaultValue
}

def envOrRootProp = { String envName, List<String> propKeys = [], String defaultValue = "" ->
    def envValue = System.getenv(envName)?.trim()
    envValue ?: optionalRootProp(propKeys, defaultValue)
}

def normalizeSigningKey = { Object raw, String charset = "UTF-8" ->
    def text = raw?.toString()?.trim()
    if (!text) return ""

    text = text.replace("\\r\\n", "\n").replace("\\n", "\n")
    if (text.startsWith("-----BEGIN PGP PRIVATE KEY BLOCK-----")) {
        return text
    }

    try {
        return new String(text.decodeBase64(), charset).trim()
    } catch (Exception ignored) {
        return text
    }
}

def modules = [
        "rate-limiter-core": [
                artifactId : "rate-limiter-core",
                pomName    : "Rate Limiter Core",
                description: "Pure 1-layer rate limiter value objects."
        ],
        "rate-limiter-spi" : [
                artifactId : "rate-limiter-spi",
                pomName    : "Rate Limiter SPI",
                description: "Pure 1-layer rate limiter SPI contracts."
        ],
]

def rootPublication = [
        artifactId : "rate-limiter",
        pomName    : "Rate Limiter",
        description: "Aggregate entry point for the rate limiter 1-layer modules."
]
def rootPublicationDependencies = [
        "rate-limiter-core",
        "rate-limiter-spi"
]

group = requiredRootProp(["release_group"])
version = requiredRootProp(["release_version"])
def rootPublicationGroupId = group.toString()
def rootPublicationVersion = version.toString()

ext {
    buildConfig = [
            javaVersion : requiredRootProp(["java_version"]).toInteger(),
            junitVersion : optionalRootProp(["junit_version"], "5.10.0"),
            junitPlatformVersion: optionalRootProp(["junit_platform_version"], "1.10.0"),
            encoding    : optionalRootProp(["encoding", "encoding_method"], "UTF-8"),
            githubOrg   : requiredRootProp(["github_org"]),
            githubRepo  : requiredRootProp(["github_repo"]),
    ]
    junitVersion = buildConfig.junitVersion
    junitPlatformVersion = buildConfig.junitPlatformVersion
    encoding = buildConfig.encoding
    githubBaseUrl = "https://github.com/${buildConfig.githubOrg}/${buildConfig.githubRepo}"
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java-library"

    ext {
        junitVer = rootProject.ext.buildConfig.junitVersion
        junitPlatformVer = rootProject.ext.buildConfig.junitPlatformVersion
        encodingMethod = rootProject.ext.buildConfig.encoding
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.ext.buildConfig.javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release.set(rootProject.ext.buildConfig.javaVersion)
        options.encoding = rootProject.ext.buildConfig.encoding
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption("Xdoclint:none", "-quiet")
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.ext.buildConfig.junitVersion}")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "org.assertj:assertj-core:3.24.2"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

apply plugin: "maven-publish"
apply plugin: "signing"

def rootSigningKey = normalizeSigningKey(
        envOrRootProp(
                "MAVEN_CENTRAL_GPG_PRIVATE_KEY",
                ["mavenCentralSigningKey"]
        ),
        rootProject.ext.buildConfig.encoding
)
def rootSigningPassword = envOrRootProp(
        "MAVEN_CENTRAL_GPG_PASSPHRASE",
        ["mavenCentralSigningPassword"]
)

publishing {
    publications {
            create("mavenJava", MavenPublication) {
                groupId = rootPublicationGroupId
                artifactId = rootPublication.artifactId
                version = rootPublicationVersion

                pom {
                    packaging = "pom"
                name = rootPublication.pomName
                description = rootPublication.description
                url = rootProject.ext.githubBaseUrl

                licenses {
                    license {
                        name = "Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0"
                    }
                }

                developers {
                    developer {
                        id = "jho951"
                        name = "YJH (jho951)"
                        url = "https://github.com/${rootProject.ext.buildConfig.githubOrg}"
                    }
                }

                scm {
                    connection = "scm:git:${rootProject.ext.githubBaseUrl}.git"
                    developerConnection = "scm:git:ssh://git@github.com/${rootProject.ext.buildConfig.githubOrg}/${rootProject.ext.buildConfig.githubRepo}.git"
                    url = rootProject.ext.githubBaseUrl
                }
            }

            pom.withXml {
                def node = asNode()
                def dependenciesNode = node.appendNode("dependencies")

                rootPublicationDependencies.each { artifactId ->
                    def dependencyNode = dependenciesNode.appendNode("dependency")
                    dependencyNode.appendNode("groupId", rootPublicationGroupId)
                    dependencyNode.appendNode("artifactId", artifactId)
                    dependencyNode.appendNode("version", rootPublicationVersion)
                    dependencyNode.appendNode("scope", "compile")
                }
            }
        }
    }
}

signing {
    if (rootSigningKey) {
        useInMemoryPgpKeys(rootSigningKey, rootSigningPassword)
    }
    sign publishing.publications
}

configure(subprojects.findAll { modules.containsKey(it.name) }) {
    apply plugin: "maven-publish"
    apply plugin: "signing"

    def moduleMeta = modules[project.name]
    def signingKey = normalizeSigningKey(
            envOrRootProp(
                    "MAVEN_CENTRAL_GPG_PRIVATE_KEY",
                    ["mavenCentralSigningKey"]
            ),
            rootProject.ext.buildConfig.encoding
    )
    def signingPassword = envOrRootProp(
            "MAVEN_CENTRAL_GPG_PASSPHRASE",
            ["mavenCentralSigningPassword"]
    )

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                from components.java

                groupId = project.group.toString()
                artifactId = moduleMeta.artifactId
                version = project.version.toString()

                pom {
                    name = moduleMeta.pomName
                    description = moduleMeta.description
                    url = rootProject.ext.githubBaseUrl

                    licenses {
                        license {
                            name = "Apache License, Version 2.0"
                            url = "https://www.apache.org/licenses/LICENSE-2.0"
                        }
                    }

                    developers {
                        developer {
                            id = "jho951"
                            name = "YJH (jho951)"
                            url = "https://github.com/${rootProject.ext.buildConfig.githubOrg}"
                        }
                    }

                    scm {
                        connection = "scm:git:${rootProject.ext.githubBaseUrl}.git"
                        developerConnection = "scm:git:ssh://git@github.com/${rootProject.ext.buildConfig.githubOrg}/${rootProject.ext.buildConfig.githubRepo}.git"
                        url = rootProject.ext.githubBaseUrl
                    }
                }
            }
        }
    }

    signing {
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications
    }
}
