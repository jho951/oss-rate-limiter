name: Publish (Maven Central)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

concurrency:
  group: maven-central-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build & Test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Publish to Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_MAVEN_CENTRAL_NAMESPACE: ${{ secrets.MAVEN_CENTRAL_NAMESPACE }}
        run: ./gradlew publishToSonatypeCentral --no-daemon --stacktrace

      - name: Finalize deployment in Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_NAMESPACE: ${{ secrets.MAVEN_CENTRAL_NAMESPACE }}
        run: |
          if [ -z "${MAVEN_CENTRAL_NAMESPACE}" ]; then
            echo "MAVEN_CENTRAL_NAMESPACE is not set; skipping Central Portal finalize step."
            exit 0
          fi
          AUTH_TOKEN="$(printf '%s' "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" | base64)"
          repository_key="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${AUTH_TOKEN}" \
              "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=${MAVEN_CENTRAL_NAMESPACE}" \
              | jq -r '.repositories[] | select(.state == "open") | .key' \
              | head -n 1
          )"

          if [ -z "${repository_key}" ] || [ "${repository_key}" = "null" ]; then
            echo "No open repository was found for namespace ${MAVEN_CENTRAL_NAMESPACE}."
            exit 1
          fi

          curl --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${AUTH_TOKEN}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${repository_key}?publishing_type=automatic"
