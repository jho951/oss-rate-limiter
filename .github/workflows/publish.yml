name: Publish to Maven Central

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.3 or v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_SOURCE="${GITHUB_REF_NAME}"
          else
            VERSION_SOURCE="${{ inputs.version }}"
          fi

          VERSION="${VERSION_SOURCE#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$VERSION_SOURCE" ]]; then
            echo "Version must not be empty, got: ${VERSION_SOURCE}"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish and release to Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_MAVEN_CENTRAL_NAMESPACE: ${{ secrets.MAVEN_CENTRAL_NAMESPACE }}
        run: ./gradlew -PVERSION_NAME=${{ steps.ver.outputs.version }} publishAndReleaseToMavenCentral
